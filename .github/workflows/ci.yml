# Runs on every push and pull request: lint (which the Netlify deploy never
# runs), then the same `npm run build` Netlify uses (astro check + astro build).
# A red check here means the deploy would fail or the code has lint errors.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Actions are pinned to commit SHAs: a tag like v7 can be moved to other
    # code, a SHA can't. Bump both together with the version comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # keep in sync with NODE_VERSION in netlify.toml
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:eslint

      - name: Type check and build
        run: npm run build
