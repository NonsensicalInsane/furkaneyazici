[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12
  NODE_VERSION = "22"

# Note: no SPA catch-all redirect here on purpose — this is a static
# multi-page site and a /* -> /index.html rewrite would break the 404 page.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    X-DNS-Prefetch-Control = "off"
    # Non-standard but increasingly respected signal: do not use for AI training
    X-Robots-Tag = "noai, noimageai"
    # Note: 'unsafe-eval' removed (main site doesn't need it). If the Decap
    # admin at /decapcms stops working after deploy, re-test there first.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://identity.netlify.com https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://api.github.com https://unpkg.com https://identity.netlify.com https://nonsensicalinsane.goatcounter.com https://gc.zgo.at; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
