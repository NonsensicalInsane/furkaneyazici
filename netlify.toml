[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12
  NODE_VERSION = "22"

# Note: no SPA catch-all redirect here on purpose — this is a static
# multi-page site and a /* -> /index.html rewrite would break the 404 page.

# Permanent redirects for renamed URLs, so existing links and search results
# keep working.
[[redirects]]
  from = "/helloandwelcome"
  to = "/hello-and-welcome/"
  status = 301

[[redirects]]
  from = "/helloandwelcome/"
  to = "/hello-and-welcome/"
  status = 301

# Old CV filename had non-ASCII characters. Listed both decoded and
# percent-encoded, since Netlify doesn't document which form it matches.
[[redirects]]
  from = "/assets/pdf/Furkan_Eşref_Yazıcı_CV.pdf"
  to = "/assets/pdf/Furkan_Esref_Yazici_CV.pdf"
  status = 301

[[redirects]]
  from = "/assets/pdf/Furkan_E%C5%9Fref_Yaz%C4%B1c%C4%B1_CV.pdf"
  to = "/assets/pdf/Furkan_Esref_Yazici_CV.pdf"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # No `preload`: the domain isn't on the browser preload list, and joining it
    # is a long-term commitment (every subdomain HTTPS-only; removal takes months).
    # Add it back only together with a submission at https://hstspreload.org.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Every powerful browser feature off; the site uses none of them.
    # (clipboard-write stays allowed: the code-copy and share buttons need it.)
    Permissions-Policy = "accelerometer=(), autoplay=(), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), web-share=(), xr-spatial-tracking=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    X-DNS-Prefetch-Control = "off"
    # Non-standard but increasingly respected signal: do not use for AI training
    X-Robots-Tag = "noai, noimageai"
    # TDMRep (W3C CG): machine-readable reservation of text-and-data-mining
    # rights under EU DSM Directive Art. 4. Also in /.well-known/tdmrep.json
    # and as a <meta> tag.
    Tdm-Reservation = "1"
    # Baseline CSP for every response. Each page also carries Astro's
    # <meta> CSP (astro.config.mjs → security.csp) whose script-src lists
    # 'self' plus a hash per inline script; browsers enforce both policies,
    # so only hashed inline scripts run even though this header keeps
    # 'unsafe-inline' (a static header can't carry per-page hashes).
    # Only first-party code is loaded (GoatCounter's script is self-hosted);
    # images and connections may reach the site itself and the GoatCounter
    # endpoint only, so injected code has no third-party channel to send to.
    # If an admin UI (e.g. Decap CMS) comes back, give it its own policy per
    # path in the edge function, not a second matching rule here (Netlify
    # doesn't document how those would combine).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://nonsensicalinsane.goatcounter.com; font-src 'self' data:; connect-src 'self' https://nonsensicalinsane.goatcounter.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
