site:
  name: Furkan Eşref Yazıcı
  site: 'https://furkaneyazici.com'
  base: '/'
  trailingSlash: true # Netlify serves page/index.html at /page/ — keep canonical URLs identical

# Default SEO metadata
metadata:
  title:
    default: Furkan Eşref Yazıcı
    template: '%s — Furkan Eşref Yazıcı'
  description: "Furkan Eşref Yazıcı — physicist and quantum software engineer. I write about machine learning, quantum computing, and software, and share my research."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Furkan Eşref Yazıcı
    images:
      - url: '~/assets/images/og-default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@furkaneyazici'
    site: '@furkaneyazici'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

    # Blog cards for posts without an `image`: false shows a text-only card,
    # true draws a generated cover whose motif follows the category. Link
    # previews (og:image) are generated either way, since they carry the title.
    cardCovers: false

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

# Email sign-up at the end of every post, sent to Buttondown (buttondown.com,
# free up to 100 subscribers). Put your Buttondown username here to switch it on;
# while it's empty the form only shows in development, as a preview.
newsletter:
  buttondown: ''

# The palette lives in src/components/CustomStyles.astro (single source of truth).
ui:
  theme: 'dark:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
