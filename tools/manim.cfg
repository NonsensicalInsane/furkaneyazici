# Manim Community settings matching furkaneyazici.com. Copy this file next to
# your scene file (Manim reads ./manim.cfg), then render, e.g.:
#   manim -qh scene.py Hadamard        # 1080p MP4 → public/videos/<post>/
#   manim -qh -s scene.py Hadamard     # last frame as a PNG, for `poster`
# and embed it in a post with <Animation src="…" poster="…" alt="…">.
[CLI]
background_color = #030617
